plugins {
    id 'com.android.application'
}

// The deployed web app this shell opens. Override with -PshiftsealUrl=... for a staging server.
def shiftsealUrl = project.findProperty('shiftsealUrl') ?: 'https://shiftseal-872210045960.asia-south1.run.app'
// Google Cloud project number that Play Integrity tokens are issued for.
def cloudProjectNumber = project.findProperty('cloudProjectNumber') ?: '872210045960'
// OAuth "Web client" ID of the Firebase project, for native Google sign-in.
def googleWebClientId = project.findProperty('googleWebClientId') ?: ''
// Each Play upload needs a higher number: -PversionCode=2, 3, ...
def appVersionCode = (project.findProperty('versionCode') ?: '1') as int
def appVersionName = project.findProperty('versionName') ?: '1.0'

// Release signing uses an upload key that never enters the repository. It is read
// from android/keystore.properties (git-ignored) or from SHIFTSEAL_UPLOAD_*
// environment variables in CI. Without it, release builds are left unsigned.
def upload = new Properties()
def uploadFile = rootProject.file('keystore.properties')
if (uploadFile.exists()) uploadFile.withInputStream { upload.load(it) }
def uploadValue = { String key ->
    upload.getProperty(key) ?: System.getenv('SHIFTSEAL_UPLOAD_' + key.replaceAll(/([A-Z])/, '_$1').toUpperCase())
}
def hasUploadKey = uploadValue('storeFile') != null

android {
    namespace 'dev.sushilraj.shiftseal'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.sushilraj.shiftseal'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [appHost: new URI(shiftsealUrl).host]
        buildConfigField 'String', 'APP_URL', "\"${shiftsealUrl}\""
        buildConfigField 'long', 'CLOUD_PROJECT_NUMBER', "${cloudProjectNumber}L"
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${googleWebClientId}\""
    }

    // A fixed debug key (debug only, not a secret) so every debug build has the
    // same SHA-1, which Firebase needs to allow Google sign-in from the app.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            release {
                storeFile rootProject.file(uploadValue('storeFile'))
                storePassword uploadValue('storePassword')
                keyAlias uploadValue('keyAlias')
                keyPassword uploadValue('keyPassword')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            if (hasUploadKey) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
