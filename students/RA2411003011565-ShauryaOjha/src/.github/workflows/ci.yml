name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Dependency audit (runtime, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          DATA_BACKEND: memory

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t fairshift:ci .
      - name: Start it and wait for /api/health
        run: |
          docker run -d --name fairshift -p 3000:3000 -e SESSION_SECRET=ci-only-secret-0123456789abcdef fairshift:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs fairshift
          exit 1
