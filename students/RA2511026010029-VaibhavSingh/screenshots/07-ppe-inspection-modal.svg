<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#0A0B0AE6" />
  
  <!-- Modal Dialog Container -->
  <rect x="200" y="40" width="500" height="520" rx="16" fill="#101310" stroke="#2E332F" stroke-width="2" />
  
  <!-- Modal Header -->
  <text x="230" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#F2F5F1">Safety Gear (PPE) Inspection &amp; Audit</text>
  <line x1="200" y1="100" x2="700" y2="100" stroke="#2E332F" stroke-width="1" />

  <!-- Worker Summary Row -->
  <rect x="230" y="115" width="440" height="50" rx="8" fill="#1A1D1B" />
  <text x="245" y="136" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F2F5F1">Rajesh Kumar (Sanitation Wing)</text>
  <text x="245" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#6B726C">Sector: SRMIST • Shift Duration: 9.2h logged</text>
  <rect x="580" y="125" width="80" height="28" rx="6" fill="#FF5A4F20" />
  <text x="620" y="143" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FF5A4F" text-anchor="middle">FLAGGED</text>

  <!-- Photo Box with GPS Watermark -->
  <rect x="230" y="180" width="440" height="170" rx="10" fill="#000000" stroke="#2E332F" />
  <circle cx="450" cy="245" r="30" fill="#D97706" />
  <rect x="420" y="215" width="60" height="18" rx="6" fill="#EAB308" />
  <path d="M380,315 C380,265 520,265 520,315 Z" fill="#3B82F6" />
  
  <!-- GPS Watermark -->
  <rect x="240" y="315" width="420" height="26" rx="6" fill="#0A0B0AE6" />
  <text x="250" y="332" font-family="monospace" font-size="10" fill="#A3E635">GPS: 12.8236° N, 80.0453° E • Captured: 07:35 AM</text>

  <!-- Audit Checklist -->
  <rect x="230" y="365" width="440" height="30" rx="6" fill="#1A1D1B" />
  <text x="245" y="385" font-family="system-ui, sans-serif" font-size="12" fill="#F2F5F1">Reflective Safety Apron / High-Vis</text>
  <text x="655" y="385" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#A3E635" text-anchor="end">DETECTED &amp; VERIFIED</text>

  <rect x="230" y="405" width="440" height="30" rx="6" fill="#1A1D1B" />
  <text x="245" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#F2F5F1">Heavy-Duty Chemical Sanitation Gloves</text>
  <text x="655" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FF5A4F" text-anchor="end">MISSING / UNCONFIRMED</text>

  <!-- Inspection Action Buttons -->
  <rect x="230" y="470" width="210" height="48" rx="10" fill="#A3E635" />
  <text x="335" y="500" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0A0B0A" text-anchor="middle">✓ Approve PPE &amp; Clear Shift</text>

  <rect x="460" y="470" width="210" height="48" rx="10" fill="#FF5A4F" />
  <text x="565" y="500" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F2F5F1" text-anchor="middle">✕ Flag Non-Compliance</text>
</svg>
