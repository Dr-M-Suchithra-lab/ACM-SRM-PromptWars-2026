<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#0A0B0A" />
  <rect x="20" y="20" width="860" height="560" rx="16" fill="#101310" stroke="#2E332F" stroke-width="2" />
  
  <!-- Header -->
  <rect x="20" y="20" width="860" height="64" rx="16" fill="#141714" />
  <circle cx="60" cy="52" r="20" fill="#A3E635" />
  <text x="60" y="58" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0A0B0A" text-anchor="middle">SD</text>
  <text x="95" y="46" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F2F5F1">Sunita Devi</text>
  <text x="95" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#6B726C">SRMIST Campus Sanitation • Blood: O+ • Age: 32 • 58kg</text>
  <rect x="730" y="36" width="130" height="32" rx="8" fill="#1A1D1B" stroke="#2E332F" />
  <text x="795" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#A3E635" text-anchor="middle">TWO-KEY SHIFT</text>

  <!-- Left Card: Vitals & Mandatory Safety PPE Photo -->
  <rect x="40" y="104" width="380" height="456" rx="12" fill="#1A1D1B" stroke="#2E332F" />
  <text x="60" y="134" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F2F5F1">Mandatory Safety Gear (PPE)</text>
  <text x="60" y="154" font-family="system-ui, sans-serif" font-size="12" fill="#6B726C">Verified with Real-time GPS Watermark before Check-in</text>
  
  <!-- Simulated Photo Box -->
  <rect x="60" y="174" width="340" height="190" rx="10" fill="#0A0B0A" stroke="#4D7C0F" stroke-width="1.5" />
  <rect x="180" y="200" width="100" height="30" rx="10" fill="#A3E635" />
  <circle cx="230" cy="245" r="30" fill="#F59E0B" />
  <path d="M150,340 C150,280 310,280 310,340 Z" fill="#22C55E" />
  <rect x="200" y="280" width="60" height="60" fill="#FACC15" />
  <!-- Watermark -->
  <rect x="70" y="325" width="320" height="28" rx="6" fill="#0A0B0AE6" />
  <text x="80" y="343" font-family="monospace" font-size="10" fill="#A3E635">GPS: 12.8234° N, 80.0451° E • 08:02 AM • ISI Certified</text>

  <!-- PPE Checklist Badges -->
  <rect x="60" y="380" width="340" height="28" rx="6" fill="#101310" />
  <text x="75" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#F2F5F1">✓ Safety Hard Hat / Cap (ISI Mark)</text>
  <rect x="60" y="415" width="340" height="28" rx="6" fill="#101310" />
  <text x="75" y="433" font-family="system-ui, sans-serif" font-size="12" fill="#F2F5F1">✓ Reflective Safety Apron / High-Vis</text>
  <rect x="60" y="450" width="340" height="28" rx="6" fill="#101310" />
  <text x="75" y="468" font-family="system-ui, sans-serif" font-size="12" fill="#F2F5F1">✓ Sanitation Heavy-Duty Gloves</text>
  
  <rect x="60" y="495" width="340" height="48" rx="12" fill="#A3E635" />
  <text x="230" y="525" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0A0B0A" text-anchor="middle">Check in for shift now</text>

  <!-- Right Card: Live Worksite Map & Geofence -->
  <rect x="440" y="104" width="420" height="456" rx="12" fill="#1A1D1B" stroke="#2E332F" />
  <text x="460" y="134" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F2F5F1">Worksite Geofence & Location</text>
  <text x="460" y="154" font-family="system-ui, sans-serif" font-size="12" fill="#6B726C">SRMIST Kattankulathur • Safe Radius: 200m</text>

  <!-- Map Representation -->
  <rect x="460" y="174" width="380" height="280" rx="10" fill="#0D130E" stroke="#2E332F" />
  <!-- Grid Lines -->
  <line x1="460" y1="240" x2="840" y2="240" stroke="#1D2A1F" stroke-width="1" />
  <line x1="460" y1="310" x2="840" y2="310" stroke="#1D2A1F" stroke-width="1" />
  <line x1="460" y1="380" x2="840" y2="380" stroke="#1D2A1F" stroke-width="1" />
  <line x1="550" y1="174" x2="550" y2="454" stroke="#1D2A1F" stroke-width="1" />
  <line x1="650" y1="174" x2="650" y2="454" stroke="#1D2A1F" stroke-width="1" />
  <line x1="750" y1="174" x2="750" y2="454" stroke="#1D2A1F" stroke-width="1" />

  <!-- Geofence Perimeter -->
  <circle cx="650" cy="310" r="90" fill="#A3E63510" stroke="#A3E635" stroke-width="2" stroke-dasharray="6,4" />
  <!-- Worker Location Pin -->
  <circle cx="645" cy="305" r="8" fill="#A3E635" />
  <circle cx="645" cy="305" r="18" fill="#A3E63530" />
  <!-- Worksite Center -->
  <circle cx="650" cy="310" r="4" fill="#F2F5F1" />
  <text x="650" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#A3E635" text-anchor="middle">You are inside worksite zone</text>

  <!-- Shift Telemetry -->
  <rect x="460" y="470" width="380" height="74" rx="10" fill="#101310" stroke="#2E332F" />
  <text x="480" y="496" font-family="system-ui, sans-serif" font-size="12" fill="#6B726C">HOURS WORKED TODAY</text>
  <text x="480" y="526" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F2F5F1">7.5h <tspan font-size="13" fill="#6B726C">/ 8.0h standard</tspan></text>
  <text x="700" y="496" font-family="system-ui, sans-serif" font-size="12" fill="#6B726C">PRIOR REST INTERVAL</text>
  <text x="700" y="526" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#A3E635">11.5h <tspan font-size="13" fill="#A3E635">OK</tspan></text>
</svg>
