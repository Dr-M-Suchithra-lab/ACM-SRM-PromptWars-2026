<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0E12" media="(prefers-color-scheme: dark)">
  <title data-i18n="admin.title">FairShift - Employer</title>
  <script src="/shared/prefs-boot.js"></script>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="has-tabbar">
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#overview" aria-label="FairShift"><img src="/logo.svg" alt="" width="32" height="32"><span class="brand-name">FairShift</span></a>
      <div class="topbar-actions">
        <span id="org-name" class="org-name no-phone"></span>
        <button id="theme-toggle" class="icon-btn" type="button"></button>
        <div class="lang" id="lang"></div>
        <button id="logout" class="icon-btn" type="button" data-i18n-attr="aria-label:common.logout"><span data-icon="logout"></span><span class="icon-btn-label" data-i18n="common.logout">Log out</span></button>
      </div>
    </div>
  </header>
  <nav class="sidenav" id="sidenav" aria-label="Sections" data-i18n-attr="aria-label:admin.menu"><ul></ul></nav>
  <div class="app-body">
    <main id="main" class="container" tabindex="-1"></main>
  </div>
  <nav class="tabbar tabbar-scroll" id="tabbar" aria-label="Sections" data-i18n-attr="aria-label:admin.menu"><ul></ul></nav>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="container">FairShift needs JavaScript. / कृपया JavaScript चालू करें।</p></noscript>
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
